version: '2.0'
service: mysql
display_name: MySQL
description: MySQL relational database connector backed by SQLAlchemy 2.0 reflection
  & parameterized queries.
categories:
- Database
homepage_url: https://www.mysql.com
spec:
  protocol: sql
auth:
- auth_mode: database_dsn
  display_name: Database connection (DSN)
  connection_config:
  - key: host
    label: Host
    placeholder: localhost
  - key: port
    label: Port
    input_type: number
    default: 3306
  - key: database
    label: Database
    placeholder: erp_prod
  credentials:
  - key: username
    label: Username
  - key: password
    label: Password
    input_type: password
    secret: true
  check:
    path: SELECT CURRENT_USER() AS id, DATABASE() AS name
actions:
- kind: entity
  id: table_records
  display_name: Database Table Records
  description: Relational table rows introspected and synced via SQLAlchemy 2.0.
  sql:
    operations:
      list: {}
      discover:
        type: sql_inspector
        container_stream: null
        metadata_path: null
        fields_field_path:
        - fields
        field_name_key: name
        field_type_key: type
        types_map: {}
      update: {}
      create: {}
x-basis-ship-tier: ga
