version: '2.0'
service: github
display_name: GitHub
description: GitHub repositories, issues, pull requests, and organization members.
categories:
- Developer Tools
- Engineering
homepage_url: https://github.com
docs_url: https://docs.github.com/en/rest
spec: {}
auth:
- auth_mode: oauth2
  display_name: OAuth 2.0
  base_url: https://api.github.com
  headers:
    Authorization: Bearer ${credentials.access_token}
  oauth2:
    authorization_url: https://github.com/login/oauth/authorize
    token_url: https://github.com/login/oauth/access_token
    pkce_s256: true
- auth_mode: api_key
  display_name: Personal Access Token
  base_url: https://api.github.com
  headers:
    Authorization: Bearer ${credentials.personal_access_token}
  credentials:
  - key: personal_access_token
    label: Personal Access Token
    input_type: password
    secret: true
  check:
    path: /user
    display_name_path: login
actions:
- kind: entity
  id: repositories
  display_name: Repositories
  cursor_field: updated_at
  default_label_field: full_name
  fields:
  - name: id
    data_type: integer
    nullable: false
    primary_key: true
  - name: full_name
    nullable: false
  - name: description
  - name: html_url
  - name: language
  - name: stargazers_count
    data_type: integer
  - name: updated_at
    data_type: datetime
  rest:
    operations:
      list:
        method: GET
        path: /user/repos
        pagination:
          type: page
          limit_param: per_page
          page_request_param: page
- kind: entity
  id: issues
  display_name: Repository Issues
  cursor_field: updated_at
  default_label_field: title
  fields:
  - name: id
    data_type: integer
    nullable: false
    primary_key: true
  - name: number
    data_type: integer
    nullable: false
  - name: title
    nullable: false
  - name: state
  - name: body
  - name: html_url
  - name: updated_at
    data_type: datetime
  rest:
    operations:
      list:
        method: GET
        path: /repos/{{config.owner}}/{{config.repo}}/issues
        query:
          state: all
        pagination:
          type: page
          limit_param: per_page
          page_request_param: page
        incremental:
          param: since
      update:
        method: PATCH
        path: /repos/{{config.owner}}/{{config.repo}}/issues/{{external_id}}
        body:
          patch: '{{patch}}'
      create:
        method: POST
        path: /repos/{{config.owner}}/{{config.repo}}/issues
        body:
          patch: '{{patch}}'
- kind: procedure
  id: get_authenticated_user
  name: get_authenticated_user
  display_name: get_authenticated_user
  description: Return the authenticated GitHub user (REST GET /user).
  rest:
    operations:
      invoke:
        method: GET
        path: /user
  required_scopes:
  - read:user
  annotations:
    idempotent_hint: true
  input_schema:
    type: object
    properties: {}
    additionalProperties: false
  output_schema:
    type: object
    properties:
      id:
        type: integer
      login:
        type: string
