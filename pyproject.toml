[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basis"
version = "0.1.0"
description = "Ontology-driven enterprise business semantics layer (Semantica SDK)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "semantica[documents,parse-pdf,nlp-spacy,llm-openai,embeddings-local,vectorstore-faiss,vectorstore-sqlite,shacl,split-tiktoken,ingest-git]>=0.7.0,<0.8.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2",
  "python-dotenv>=1.0",
  "PyYAML>=6",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "authlib>=1.3.2",
  "httpx>=0.27",
  "email-validator>=2.0",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "PyYAML>=6",
  "schemathesis>=3.38",
  "pymysql>=1.1",
  "import-linter>=2.1",
]
# 扫描件 PDF、更多向量后端、多 LLM 网关（体积大，按需装）
heavy = [
  "semantica[parse-docling,vectorstore-pgvector,llm-litellm,graph-neo4j]>=0.7.0,<0.8.0",
]
# Optional: upstream ``semantica-explorer`` CLI only (not required for ``uv run basis``).
explorer = [
  "semantica[explorer]>=0.7.0,<0.8.0",
]
saml = [
  "python3-saml>=1.16.0",
]

[project.scripts]
basis = "basis.cli:main"

[tool.setuptools.packages.find]
include = ["basis*"]

[tool.setuptools.package-data]
"basis.infra.tooling.db" = ["migrations/*.sql", "alembic/**/*"]
"basis.domain.connector" = ["providers/*.yaml", "providers/*.yml"]
"basis.domain.connector.synthesis" = ["batches/*.yaml", "executors-index.json"]

[tool.uv]
# Committed lockfile must use the default index so CI (GitHub-hosted) can fetch wheels.
index-url = "https://pypi.org/simple"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
  "tests/integration",
  "tests/use_cases",
  "tests/contract",
]
markers = [
  "integration: real database or external service (optional env)",
]
