services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: basis
      MYSQL_DATABASE: basis
      MYSQL_USER: basis
      MYSQL_PASSWORD: basis
    ports:
      - "3306:3306"
    volumes:
      - basis_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pbasis"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  basis_mysql_data:
