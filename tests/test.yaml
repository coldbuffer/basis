# Test harness settings (pytest integration + Playwright E2E). See tests/README.md.
# Shell or CI env overrides YAML (secrets: BASIS_TEST_GITHUB_* / BASIS_E2E_GITHUB_*).

postgres:
  # Admin URL for CREATEDB / ephemeral test databases. Matches CI postgres service and
  # `docker compose -f docker/compose.postgres.yml` (connect to the `postgres` maintenance DB).
  admin_url: postgresql://basis:basis@127.0.0.1:5432/postgres
  # Optional writable target for BOCP SQL connector tests when CREATEDB is denied.
  # sql_target_url: postgresql://basis:basis@127.0.0.1:5432/basis

e2e:
  api_port: 8091
  web_port: 5174
  demo_workspace: true

e2e_desktop:
  api_port: 8092
  web_port: 5175
  demo_workspace: true
