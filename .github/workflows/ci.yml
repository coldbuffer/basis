name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_INDEX_URL: https://pypi.org/simple
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: basis
          POSTGRES_PASSWORD: basis
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U basis -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Postgres URL: tests/test.yaml (same as local pytest)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: PostgreSQL integration and backup restore
        run: >-
          uv run pytest tests/integration/test_postgres_integration.py
          tests/integration/test_postgres_backup_restore.py
          tests/integration/test_sql_connector_integration.py::test_sql_connector_postgres_check_discover_read_mutate
          -q

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Product docs MCP tools index (drift)
        run: uv run python scripts/docs/generate-product-docs-mcp-tools.py --check

      - name: Regenerate OpenAPI v1 JSON
        run: uv run python scripts/openapi/generate-openapi-v1.py --data-dir /tmp/basis-openapi-gen

      - name: Fail on OpenAPI drift
        run: git diff --exit-code openapi/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Spectral lint OpenAPI v1
        run: >-
          npx --yes @stoplight/spectral-cli@6.15.0 lint
          openapi/basis-v1.json openapi/basis-v1-workspaces.json openapi/basis-v1-platform.json

      - name: Web ↔ OpenAPI path audit (S0)
        run: node scripts/audit/audit-web-openapi-paths.mjs

      - name: Web ↔ operationId audit (S0)
        run: uv run python scripts/openapi/audit-web-operation-ids.py

  client-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Regenerate web OpenAPI types
        working-directory: web
        run: npm ci && npm run gen:openapi-types

      - name: Fail on schema drift
        run: git diff --exit-code web/src/lib/openapi/schema.d.ts web/src/lib/openapi/schema-workspaces.d.ts

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - name: Test file naming (tests/README.md)
        run: uv run python scripts/audit/audit-test-naming.py

      - name: Layer import contracts (import-linter)
        run: uv run lint-imports --config importlinter.ini

      - name: Line 1 import guards (explorer legacy)
        run: |
          uv run python scripts/audit/audit-semantica-explorer-imports.py
          uv run python scripts/audit/audit-semantica-explorer-session-imports.py
          uv run python scripts/audit/audit-semantica-explorer-package-imports.py
          uv run python scripts/audit/audit-graph-shim-imports.py
          uv run python scripts/audit/audit-knowledge-connector-imports.py
          uv run python scripts/audit/audit-knowledge-persistence-stubs.py
          uv run python scripts/audit/audit-knowledge-persistence-imports.py
          uv run python scripts/audit/audit-compat-shim-imports.py
          uv run python scripts/audit/audit-legacy-package-imports.py
          uv run python scripts/audit/audit-workspace-http-aggregators.py
          uv run python scripts/audit/audit-http-shared-stubs.py
          uv run python scripts/audit/audit-http-mount-v1.py
          uv run python scripts/audit/audit-http-mount-workspace.py
          uv run python scripts/audit/audit-http-workspace-router-mounts.py
          uv run python scripts/audit/audit-http-operation-parity.py --strict
          uv run python scripts/audit/audit-http-mount-platform.py
          uv run python scripts/audit/audit-mcp-http-decouple.py
          uv run python scripts/audit/audit-connector-http-duplication.py
          uv run python scripts/audit/audit-web-module-cross-ui.py

      - name: Explorer compat session (default BasisGraphSession)
        run: >-
          uv run pytest -q
          tests/integration/test_basis_graph_session.py
          tests/integration/test_graph_session_registry.py
          tests/integration/test_workspace_ontology.py
          tests/integration/test_graph_session_routes.py

      - name: Run tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Desktop web build
        run: npm run build:desktop

      - name: Unit tests
        run: npm run test

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies (dev server)
        working-directory: web
        run: npm ci

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npx playwright install chromium --with-deps

      - name: Playwright smoke
        working-directory: tests/e2e
        run: CI=1 npm test

  e2e-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Python dependencies
        run: uv sync --extra dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies (dev server)
        working-directory: web
        run: npm ci

      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npx playwright install chromium --with-deps

      - name: Desktop product Playwright
        working-directory: tests/e2e
        run: CI=1 BASIS_E2E_DESKTOP=1 npm test desktop-product.e2e.spec.ts
