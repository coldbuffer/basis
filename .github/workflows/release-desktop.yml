name: Release Desktop

on:
  push:
    tags:
      - desktop-v*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build unsigned macOS artifacts
        working-directory: desktop
        run: npm run dist:mac:unsigned

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: desktop/release/*
          if-no-files-found: error

  build-win:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build unsigned Windows artifacts
        working-directory: desktop
        run: npm run dist:win:unsigned

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: desktop/release/*
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos
          path: dist/desktop/macos

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: dist/desktop/windows

      - name: Create draft GitHub Release (desktop)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag" \
            --draft \
            --verify-tag \
            --title "Basis ${tag} (Desktop)" \
            --notes "Unsigned desktop builds for **${tag}**.

          Installers are not code-signed; macOS may require Gatekeeper override, Windows SmartScreen may warn.

          Tag format: \`desktop-v*\` (separate from container releases \`v*\`)."
          shopt -s nullglob
          gh release upload "$tag" dist/desktop/macos/* dist/desktop/windows/* --clobber
