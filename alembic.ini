[alembic]
script_location = basis/infra/db/alembic
prepend_sys_path = .
# CLI fallback only when BASIS_DATABASE_URL is unset (local SQLite, BASIS_DATA_DIR=data).
# When .env sets BASIS_DATABASE_URL=postgresql://…, `alembic/env.py` uses Postgres for
# `uv run python -m alembic -c alembic.ini upgrade head` (not this line).
# Runtime/API calls `alembic_upgrade.upgrade_head` with an explicit URL (locked; env ignored).
sqlalchemy.url = sqlite:///data/basis.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
